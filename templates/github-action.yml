name: Voice check

on:
  pull_request:
    paths:
      - '**/*.md'
      - '**/*.mdx'
      - '**/*.tsx'
      - '**/*.jsx'
      - '**/*.ts'
      - '**/*.js'
      - '**/*.html'
      - 'foundrkit.config.*'
      - 'forbidden.json'
  push:
    branches: [main]

jobs:
  voice-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run foundrkit-lint
        run: npx -y foundrkit-lint --reporter=github-action
