name: Voice check

on:
  pull_request:
    paths:
      - '**/*.md'
      - '**/*.mdx'
      - '**/*.tsx'
      - '**/*.jsx'
      - '**/*.ts'
      - '**/*.js'
      - '**/*.html'
      - '**/*.txt'
      - 'foundrkit.config.*'
      - 'forbidden.json'
      - '.foundrkitrc.json'
  push:
    branches: [main]

jobs:
  voice-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # foundrkit-lint is installed from GitHub, not the npm registry.
      # To pin a version, use github:whystrohm/foundrkit-lint#<commit-sha>.
      # If the repo already lists it in devDependencies, run
      # "npm ci" and then "npx foundrkit-lint --reporter=github-action" instead.
      - name: Run foundrkit-lint
        run: npx --yes github:whystrohm/foundrkit-lint --reporter=github-action
